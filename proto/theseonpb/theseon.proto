syntax = "proto3";

package theseonpb;

option go_package = "github.com/ulixert/theseon/proto/theseonpb";

// ---- Client-facing service ----

service Theseon {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
  rpc BatchWrite(BatchWriteRequest) returns (BatchWriteResponse);

  // Vector operations
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc VectorPut(VectorPutRequest) returns (VectorPutResponse);
  rpc VectorDelete(VectorDeleteRequest) returns (VectorDeleteResponse);
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  bool  found = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {}

message ScanRequest {}

message ScanResponse {
  bytes key = 1;
  bytes value = 2;
}

message BatchWriteRequest {
  repeated BatchEntry entries = 1;
}

message BatchEntry {
  bytes key = 1;
  bytes value = 2;
  bool  is_delete = 3;
}

message BatchWriteResponse {}

// ---- Node-to-node data plane ----

service InternalService {
  // SWIM protocol RPCs
  rpc Ping(PingRequest) returns (PingResponse);
  rpc PingReq(PingReqRequest) returns (PingReqResponse);
  rpc GossipSync(GossipSyncRequest) returns (GossipSyncResponse);

  // Data-plane replication RPCs
  rpc ReplicateWrite(ReplicateWriteRequest) returns (ReplicateWriteResponse);
  rpc ReplicateWriteBatch(ReplicateWriteBatchRequest) returns (ReplicateWriteBatchResponse);
  rpc ReplicateRead(ReplicateReadRequest) returns (ReplicateReadResponse);

  // Vector replication RPCs
  rpc ReplicateVectorWrite(ReplicateVectorWriteRequest) returns (ReplicateVectorWriteResponse);
  rpc ReplicateVectorDelete(ReplicateVectorDeleteRequest) returns (ReplicateVectorDeleteResponse);
  rpc ReplicateVectorSearch(ReplicateVectorSearchRequest) returns (ReplicateVectorSearchResponse);

  // Anti-entropy RPCs - Merkle-tree reconciliation between co-replicas.
  rpc ComputeAERoot(AERootRequest) returns (AERootResponse);
  rpc GetAESubtree(AESubtreeRequest) returns (AESubtreeResponse);
  rpc GetAELeafKeys(AELeafRequest) returns (stream AELeafEntry);
}

// SWIM Ping - direct probe with piggybacked gossip updates and ring descriptor.
message PingRequest {
  string sender_id = 1;
  string sender_addr = 2;
  repeated MemberUpdateProto updates = 3;
  RingDescriptorProto ring_descriptor = 4;  // piggybacked for fast convergence
}

message PingResponse {
  string sender_id = 1;
  string sender_addr = 2;
  repeated MemberUpdateProto updates = 3;
  RingDescriptorProto ring_descriptor = 4;  // piggybacked for fast convergence
}

// SWIM PingReq - indirect probe: ask an intermediary to ping the target.
message PingReqRequest {
  string target_id = 1;
  string target_addr = 2;
}

message PingReqResponse {
  bool ack = 1;
}

// GossipSync - full membership table exchange for discovery.
message GossipSyncRequest {
  string sender_id = 1;
  string sender_addr = 2;
  repeated MemberUpdateProto members = 3;
  RingDescriptorProto ring_descriptor = 4;  // include ring for full state exchange
}

message GossipSyncResponse {
  repeated MemberUpdateProto members = 1;
  RingDescriptorProto ring_descriptor = 2;  // include ring for full state exchange
}

// MemberUpdateProto carries the gossip state for a single member.
message MemberUpdateProto {
  string node_id = 1;
  string addr = 2;
  int32  liveness = 3;  // 0=alive, 1=suspect, 2=dead
  int32  ring_state = 4;  // 0=none, 1=joining, 2=active
  uint64 incarnation = 5;
}

// Ring descriptor - versioned, only changed by admin commands.
message RingDescriptorProto {
  uint64 version = 1;
  repeated RingMemberProto members = 2;
}

message RingMemberProto {
  string node_id = 1;
  string addr = 2;
  int32  ring_state = 3;  // 0=joining, 1=active
}

// ---- HLC timestamp for replication RPCs ----

message HLCTimestamp {
  int64  wall_time = 1;  // nanoseconds since epoch
  uint32 logical = 2;
  string node_id = 3;
}

// ReplicateWrite - replica receives a write from the coordinator.
message ReplicateWriteRequest {
  bytes        key = 1;
  bytes        value = 2;
  HLCTimestamp timestamp = 3;
  bool         deleted = 4;  // true = tombstone
}

message ReplicateWriteResponse {}

// ReplicateWriteBatch - batch of replicated writes (atomic).
message ReplicateWriteBatchRequest {
  repeated ReplicateWriteRequest entries = 1;
}

message ReplicateWriteBatchResponse {}

// ReplicateRead - replica returns a single key with its envelope metadata.
message ReplicateReadRequest {
  bytes key = 1;
}

message ReplicateReadResponse {
  bytes        value = 1;
  HLCTimestamp timestamp = 2;
  bool         found = 3;
  bool         deleted = 4;
}

// ---- Vector operations (client-facing) ----

message CreateCollectionRequest {
  string name = 1;
  int32  dim = 2;
  uint32 metric = 3;  // 1=L2, 2=Cosine, 3=InnerProduct
  int32  m = 4;
  int32  ef_construct = 5;
  int32  ef_search = 6;
  int64  max_vectors = 7;
}

message CreateCollectionResponse {}

message VectorPutRequest {
  string              collection = 1;
  bytes               id = 2;  // 16-byte UUID
  repeated float      vector = 3;
  map<string, bytes>  metadata = 4;
}

message VectorPutResponse {}

message VectorDeleteRequest {
  string collection = 1;
  bytes  id = 2;  // 16-byte UUID
}

message VectorDeleteResponse {}

message VectorSearchRequest {
  string         collection = 1;
  repeated float query = 2;
  int32          k = 3;
  int32          ef_search = 4;  // 0 = default
  int32          oversample = 5;  // 0 = default (4). Only used by coordinator.
}

message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
}

message VectorSearchResult {
  bytes          id = 1;  // 16-byte UUID
  repeated float vector = 2;  // raw vector for exact reranking
  float          distance = 3;
  map<string, bytes> metadata = 4;
  int64          version_wall_time = 5;  // VectorVersion for merge/dedup
  uint32         version_logical = 6;
}

// ---- Vector replication (node-to-node) ----

message ReplicateVectorWriteRequest {
  string              collection = 1;
  bytes               id = 2;  // 16-byte UUID
  repeated float      vector = 3;
  map<string, bytes>  metadata = 4;
  HLCTimestamp        timestamp = 5;
  uint64              config_digest = 6;
}

message ReplicateVectorWriteResponse {}

message ReplicateVectorDeleteRequest {
  string       collection = 1;
  bytes        id = 2;  // 16-byte UUID
  HLCTimestamp timestamp = 3;
  uint64       config_digest = 4;
}

message ReplicateVectorDeleteResponse {}

message ReplicateVectorSearchRequest {
  string         collection = 1;
  repeated float query = 2;
  int32          k = 3;
  int32          ef_search = 4;
  uint64         config_digest = 5;
}

message ReplicateVectorSearchResponse {
  repeated VectorSearchResult results = 1;
}

// ---- Anti-entropy ----
//
// AEKeyspaceDigest pins the parameters of a reconciliation round.
// Both sides build trees with identical fanout/depth and apply the
// same grace_cutoff_wall filter. ring_version aborts the round if
// either side has shifted ring topology mid-reconcile.
message AEKeyspaceDigest {
  uint64 ring_version = 1;
  // Identifies BOTH endpoints unambiguously so each side can compute
  // the "other" end and apply the symmetric (self, other) filter.
  string initiator_id = 2;       // node that started this reconcile round
  string target_id = 3;          // node serving this RPC
  uint32 depth = 4;
  uint32 fanout = 5;
  int64  grace_cutoff_wall = 6;  // hlc.WallTime; entries with WallTime >= this are excluded
  int32  replication_factor = 7; // N - must agree between sides
}

message AERootRequest {
  AEKeyspaceDigest digest = 1;
}

message AERootResponse {
  uint64 root_hash = 1;
  bool   ring_version_mismatch = 2;
}

message AESubtreeRequest {
  AEKeyspaceDigest digest = 1;
  repeated uint32  path = 2;     // child indices from root; empty = root's direct children
}

message AESubtreeResponse {
  repeated uint64 child_hashes = 1;
  bool   ring_version_mismatch = 2;
}

message AELeafRequest {
  AEKeyspaceDigest digest = 1;
  uint32 bucket_index = 2;
}

message AELeafEntry {
  bytes        key = 1;
  HLCTimestamp timestamp = 2;
  bool         deleted = 3;
}

// ---- Operator topology management ----

service AdminService {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc JoinRing(JoinRingRequest) returns (JoinRingResponse);
  rpc ActivateNode(ActivateNodeRequest) returns (ActivateNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);

  // Anti-entropy admin: trigger a reconcile against one or all peers.
  rpc TriggerAntiEntropy(TriggerAERequest) returns (TriggerAEResponse);
}

message TriggerAERequest {
  string peer_id = 1;   // empty = all owned peers
  bool   blocking = 2;  // true = wait for completion, return stats
}

message TriggerAEResponse {
  repeated AEReconcileStats stats = 1;
}

message AEReconcileStats {
  string peer_id = 1;
  uint64 keys_scanned = 2;
  uint64 divergent_leaves = 3;
  uint64 keys_repaired = 4;
  int64  duration_ms = 5;
  string error = 6;
}

message GetNodeInfoRequest {}
message GetNodeInfoResponse {
  string node_id = 1;
  string addr = 2;
  int32  liveness = 3;
  int32  ring_state = 4;
}

message GetClusterStatusRequest {}
message GetClusterStatusResponse {
  repeated MemberUpdateProto members = 1;
  RingDescriptorProto ring_descriptor = 2;
}

message JoinRingRequest {
  string addr = 1;              // address of the node to join
  uint64 expected_version = 2;  // CAS guard: current ring descriptor version the caller expects
  string node_id = 3;           // unique identifier of the node to join
}
message JoinRingResponse {
  string node_id = 1;
}

message ActivateNodeRequest {
  string node_id = 1;
  uint64 expected_version = 2;  // CAS guard: current ring descriptor version the caller expects
}
message ActivateNodeResponse {}

message RemoveNodeRequest {
  string node_id = 1;
  uint64 expected_version = 2;  // CAS guard: current ring descriptor version the caller expects
}
message RemoveNodeResponse {}
